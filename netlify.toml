# Static SPA only. The Node API runs on a DigitalOcean droplet and the browser
# calls it directly via VITE_API_BASE (set in Netlify's environment variables).
# Match NOTIFY_ALLOWED_ORIGINS on the API to your Netlify URL (and custom domain).

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routing (React Router): non-file paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
